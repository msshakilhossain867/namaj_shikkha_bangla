	<h2>ওযূ শেষ হওয়ার পর দোয়া</h2>

	<div style="padding: 10px;background: #eee;border-radius: 10px;white-space: pre-line;">

<p style="font-weight: bolder;">اَللّٰهُمَّ اجْعَلْنِىْ مِنَ الْتَّوَابِيْنَ وَاجْعَلْنِىْ مِنَ الْمُتَطَهِّرِيْنَ  </p>

<b style="color: #0B6623;">উচ্চারণঃ</b> আল্লাহুম্মাজ’আলনী মিনাত্ তাওয়াবীনা ওয়াজ’আলনী মিনাল মুতাত্বাহ্হিরীন।

 
	</div>
